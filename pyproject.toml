[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "aquinas-local"
version = "0.2.0a2"
description = "Auditable offline Thomistic retrieval, evaluation, and adapter training"
requires-python = ">=3.11"
dependencies = []
[project.optional-dependencies]
train = ["torch>=2.6", "transformers>=5.12.1,<6", "peft>=0.21,<1", "accelerate>=1.0,<2", "safetensors>=0.4"]
[project.scripts]
aquinas = "aquinas.cli:main"
aquinas-adapter = "aquinas.adapter:main"
[tool.setuptools]
packages = ["aquinas"]
