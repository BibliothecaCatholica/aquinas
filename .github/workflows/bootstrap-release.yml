name: Publish prepared Aquinas alpha
on:
  push:
    branches: [main]
    paths: [.github/workflows/bootstrap-release.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aquinas-alpha-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: BibliothecaCatholica/aquinas
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse an already populated repository
        run: |
          set -euo pipefail
          test "$(git ls-files | wc -l)" -eq 2
          test "$(git hash-object README.md)" = f039995e78134b3385bec8f7f9203e0a0142cf67
          if git rev-parse --verify refs/tags/v0.2.0-alpha.1; then
            echo 'Release tag already exists; refusing to overwrite it.'
            exit 1
          fi
      - name: Download and verify the prepared draft asset
        run: |
          set -euo pipefail
          gh api repos/BibliothecaCatholica/aquinas/releases/445721682 > "$RUNNER_TEMP/release.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'release.json').read_text())
          assert r['draft'] and r['tag_name']=='v0.2.0-alpha.1'
          assert any(a['id']==749345132 and a['size']==36990454 for a in r['assets'])
          PY
          gh api -H 'Accept: application/octet-stream' repos/BibliothecaCatholica/aquinas/releases/assets/749345132 > "$RUNNER_TEMP/alpha.zip"
          echo "158358111586b6391cffe70ff42cec47b40c745bd1b86d86ef4c24f951e1028a  $RUNNER_TEMP/alpha.zip" | sha256sum --check
      - name: Import the verified package without generated files
        run: |
          python - <<'PY'
          import os, zipfile
          from pathlib import Path
          root=Path.cwd().resolve()
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP'])/'alpha.zip') as archive:
              for entry in archive.infolist():
                  path=Path(entry.filename)
                  assert path.parts[0]=='aquinas' and not path.is_absolute()
                  assert '..' not in path.parts and '.git' not in path.parts and '.github' not in path.parts
                  target=root.joinpath(*path.parts[1:])
                  assert target.resolve().is_relative_to(root)
                  if entry.is_dir():
                      target.mkdir(parents=True,exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True,exist_ok=True)
                      target.write_bytes(archive.read(entry))
          PY
      - name: Validate sources, adapter integrity and all 33 checks
        run: |
          set -euo pipefail
          python -m pip install -e .
          python -m aquinas.cli ingest
          python -m aquinas.cli index
          python -m aquinas.cli validate
          python -m unittest discover -s tests -v
      - name: Commit source and publish prerelease at that commit
        run: |
          set -euo pipefail
          git config user.name 'Bibliotheca Catholica'
          git config user.email '345909527+BibliothecaCatholica@users.noreply.github.com'
          git add .
          git commit -m 'Release Aquinas experimental source-conditioned alpha'
          git push origin HEAD:main
          gh release edit v0.2.0-alpha.1 --target "$(git rev-parse HEAD)" --draft=false --prerelease --notes-file docs/RELEASE.md
          gh release view v0.2.0-alpha.1 --json url,tagName,isDraft,isPrerelease
